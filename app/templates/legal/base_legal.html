{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- En-tête -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 mb-8">
            <h1 class="text-3xl lg:text-4xl font-bold text-gray-900 dark:text-white mb-4">
                {% block legal_title %}{% endblock %}
            </h1>
            <p class="text-gray-600 dark:text-gray-400">
                {% block legal_subtitle %}{% endblock %}
            </p>
        </div>
        
        <!-- Contenu -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8">
            <div class="prose prose-lg dark:prose-invert max-w-none">
                {% block legal_content %}{% endblock %}
            </div>
        </div>
        
        <!-- Navigation -->
        <div class="mt-8 flex flex-wrap justify-center gap-4">
            <a href="{{ url_for('legal_mentions') }}" class="text-primary-600 hover:text-primary-700 text-sm">Mentions légales</a>
            <span class="text-gray-300">|</span>
            <a href="{{ url_for('legal_privacy') }}" class="text-primary-600 hover:text-primary-700 text-sm">Confidentialité</a>
            <span class="text-gray-300">|</span>
            <a href="{{ url_for('legal_terms') }}" class="text-primary-600 hover:text-primary-700 text-sm">Conditions</a>
            <span class="text-gray-300">|</span>
            <a href="{{ url_for('legal_cookies') }}" class="text-primary-600 hover:text-primary-700 text-sm">Cookies</a>
        </div>
    </div>
</div>
{% endblock %}
